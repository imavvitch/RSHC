; Shader formats the game can run with. All three are needed: a pack cooked without the Vulkan line shows a grey
; checkerboard for players on Vulkan.

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
D3D12TargetedShaderFormats=PCD3D_SM6
+D3D11TargetedShaderFormats=PCD3D_SM5
+VulkanTargetedShaderFormats=SF_VULKAN_SM5

; The kit keeps its shader cache inside the project, so a second build takes minutes instead of the best part of an hour.

[RSHCKitCache]
Root=(Type=KeyLength, Length=120, Inner=AsyncPut)
AsyncPut=(Type=AsyncPut, Inner=Hierarchy)
Hierarchy=(Type=Hierarchical, Inner=EnginePak, Inner=Local)
EnginePak=(Type=ReadPak, Filename="../../../Engine/DerivedDataCache/Compressed.ddp", Compressed=true)
Local=(Type=FileSystem, UnusedFileAge=34, Path="%GAMEDIR%DerivedDataCache")
